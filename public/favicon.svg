  <!-- Dynamic Sovereign Persian Wing (بال سه‌گانه شاهین هخامنشی) -->
  <path d="M 28 84 L 28 26 C 28 15, 38 9, 50 9 C 68 9, 86 10, 95 10 C 80 18, 70 26, 70 38 C 70 52, 58 61, 44 61 L 28 61" 
        stroke="url(#favArtCyan)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sacred Mithraic Ring of Covenant -->
