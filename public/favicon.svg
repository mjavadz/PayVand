<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="favWing" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Faravahar Tripartite Feathers -->
  <path d="M 40 22 C 26 20, 12 22, 6 27 C 16 31, 28 33, 40 33 Z" fill="url(#favWing)" />
  <path d="M 40 36 C 26 35, 14 37, 10 42 C 20 45, 30 46, 40 46 Z" fill="url(#favWing)" />
  <path d="M 40 49 C 28 49, 18 52, 16 57 C 24 59, 32 59, 40 58 Z" fill="url(#favWing)" opacity="0.8" />

  <!-- Main Bold P Pillar -->
  <path d="M 40 84 L 40 18" stroke="url(#favGold)" stroke-width="10" stroke-linecap="round" />

  <!-- P Loop -->
  <path d="M 40 18 C 60 18, 80 26, 80 40 C 80 54, 60 62, 40 62" 
        stroke="url(#favGold)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sacred Ring of Covenant -->
  <circle cx="56" cy="40" r="10" stroke="url(#favGold)" stroke-width="3.5" />
  <circle cx="56" cy="40" r="4.5" fill="#FDE047" />

  <!-- Twin Lower Faravahar Ribbons -->
  <path d="M 40 68 C 30 76, 20 80, 12 82" stroke="url(#favWing)" stroke-width="5" stroke-linecap="round" />
  <path d="M 40 68 C 48 76, 56 80, 64 82" stroke="url(#favGold)" stroke-width="5" stroke-linecap="round" />
</svg>