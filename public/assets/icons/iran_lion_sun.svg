<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="100%" height="100%" fill="none">
  <!-- Tricolor Bands -->
  <rect width="120" height="26.67" fill="#1E824C" rx="2"/>
  <rect y="26.67" width="120" height="26.66" fill="#FFFFFF"/>
  <rect y="53.33" width="120" height="26.67" fill="#C01823" rx="2"/>

  <!-- The Radiant Sun of Mithra (خورشید تابان با پرتوهای شعاعی زرین) -->
  <g transform="translate(60, 36)">
    <!-- Golden Sun Aura -->
    <circle cx="0" cy="0" r="13" fill="#F59E0B"/>
    <circle cx="0" cy="0" r="9.5" fill="#FDE047"/>
    <!-- Sun Face / Solar Core -->
    <circle cx="0" cy="0" r="4" fill="#D97706" opacity="0.6"/>
    
    <!-- Alternating Royal Sunbeams (پرتوهای خورشید) -->
    <path d="M 0 -22 L 2.5 -13 L -2.5 -13 Z" fill="#D97706"/>
    <path d="M 12 -18 L 11 -9 L 7 -12 Z" fill="#D97706"/>
    <path d="M -12 -18 L -7 -12 L -11 -9 Z" fill="#D97706"/>
    <path d="M 20 -9 L 14 -5 L 13 -10 Z" fill="#D97706"/>
    <path d="M -20 -9 L -13 -10 L -14 -5 Z" fill="#D97706"/>
    <path d="M 22 2 L 14 0 L 15 4 Z" fill="#D97706"/>
    <path d="M -22 2 L -15 4 L -14 0 Z" fill="#D97706"/>
    
    <!-- Curved Solar Ray Waves -->
    <path d="M 6 -20 Q 9 -16 6 -12" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
    <path d="M -6 -20 Q -9 -16 -6 -12" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
    <path d="M 17 -14 Q 18 -10 14 -8" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
    <path d="M -17 -14 Q -18 -10 -14 -8" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
  </g>

  <!-- The Imperial Persian Lion (شیر غران شمشیر به‌دست) -->
  <g transform="translate(60, 42)">
    <!-- Arched Tail over spine with prominent bushy tuft -->
    <path d="M -22 5 C -25 -2, -24 -10, -18 -14 C -15 -16, -13 -14, -15 -11 C -18 -8, -18 -2, -14 4" 
          stroke="#B45309" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Tail Tuft (منگوله دم شیر) -->
    <path d="M -18 -14 C -21 -17, -19 -21, -15 -19 C -13 -17, -14 -15, -18 -14 Z" fill="#D97706"/>

    <!-- Powerful Lion Torso, Flank and Haunches -->
    <path d="M -18 3 C -19 -3, -14 -6, -8 -6 C 0 -6, 6 -4, 12 -7 C 14 -8, 17 -8, 20 -4 C 23 0, 22 6, 17 8 C 12 10, -2 11, -12 11 C -16 11, -18 8, -18 3 Z" fill="#D97706"/>
    
    <!-- Lion Royal Mane (یال شیر با تارهای اساطیری) -->
    <path d="M 6 -6 C 8 -12, 14 -16, 20 -15 C 24 -14, 26 -10, 25 -5 C 25 0, 20 4, 15 2 C 11 0, 8 -2, 6 -6 Z" fill="#B45309"/>
    <path d="M 12 -12 C 16 -15, 20 -14, 22 -10 C 23 -6, 20 -3, 16 -4 Z" fill="#D97706"/>

    <!-- Lion Crowned Head & Facial Profile (سر باوقار شیر رو به جلو) -->
    <circle cx="21" cy="-8" r="4.5" fill="#D97706"/>
    <circle cx="21" cy="-8" r="3" fill="#F59E0B"/>
    <!-- Lion Ear -->
    <path d="M 21 -13 C 23 -15, 25 -13, 24 -11 Z" fill="#B45309"/>
    <!-- Fierce Royal Eye -->
    <circle cx="23" cy="-9" r="0.9" fill="#451A03"/>
    <circle cx="23.2" cy="-9.2" r="0.3" fill="#FFFFFF"/>
    <!-- Snout & Whisker Arch -->
    <path d="M 24 -7 Q 27 -7 26 -5 Q 24 -4 22 -5" fill="#B45309"/>

    <!-- 4 Muscular Legs (پاها و پنجه‌های قدرتمند) -->
    <path d="M -16 6 C -18 10, -18 14, -14 16 L -10 16 C -12 13, -12 9, -13 6 Z" fill="#B45309"/>
    <path d="M -8 7 C -9 11, -9 14, -6 16 L -2 16 C -4 13, -5 9, -5 7 Z" fill="#D97706"/>
    <path d="M 7 5 C 7 10, 7 13, 10 16 L 14 16 C 12 13, 11 9, 11 5 Z" fill="#D97706"/>
    
    <!-- Right Foreleg (Raised high holding the sword) -->
    <path d="M 16 2 C 18 -1, 21 -3, 24 -2 C 26 -1, 26 2, 23 4 L 18 6 Z" fill="#B45309"/>
    <circle cx="24" cy="-2" r="2.2" fill="#D97706"/>

    <!-- The Curved Persian Shamshir Scimitar (شمشیر هلالی اصیل ایرانی) -->
    <path d="M 22 1 L 26 -5" stroke="#451A03" stroke-width="2" stroke-linecap="round"/>
    <path d="M 21 -1 L 25 -3" stroke="#FDE047" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Curved Persian Steel Blade (تیغه هلالی فولادی با لبه زرین) -->
    <path d="M 25 -4 C 28 -12, 33 -18, 41 -22 C 41.5 -22, 41.2 -21, 39.5 -19 C 34 -13, 30 -5, 27 1 Z" fill="#1E293B"/>
    <path d="M 26 -3 C 29 -11, 34 -17, 41 -21" stroke="#FDE047" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Outer Border -->
  <rect x="0.5" y="0.5" width="119" height="79" rx="3.5" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
</svg>