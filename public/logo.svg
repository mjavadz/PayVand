<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="pvGoldMaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="40%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="pvCyanMaster" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#2979FF" />
    </linearGradient>
    <filter id="masterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#00E5FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dynamic Sovereign Wing Arc (Simurgh / Faravahar Upper Wing & P Streamline) -->
  <path d="M 28 82 L 28 26 C 28 16, 36 10, 48 10 C 64 10, 86 11, 93 11 C 76 18, 66 26, 66 38 C 66 52, 54 60, 42 60 L 28 60" 
        stroke="url(#pvCyanMaster)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#masterGlow)" />

  <!-- Sacred Ring of Covenant (حلقه پیمان و پیوند جاودان اهورا مزدا) -->
  <circle cx="46" cy="35" r="10.5" stroke="url(#pvGoldMaster)" stroke-width="4.5" />
  <circle cx="46" cy="35" r="4" fill="#FFD54F" />

  <!-- Persian Cyber Streamer / Khvarenah Tail (روبان فَرّ کیانی) -->
  <path d="M 28 66 C 20 74, 14 78, 8 80" stroke="url(#pvCyanMaster)" stroke-width="5" stroke-linecap="round" />
</svg>