<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="payvandGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="payvandWing" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Faravahar Tripartite Wings (Humata, Hukhta, Hvarshta: Good Thoughts, Good Words, Good Deeds) -->
  <!-- Upper Feather (Longest) -->
  <path d="M 40 22 C 28 20, 14 22, 6 27 C 16 31, 28 33, 40 33 Z" fill="url(#payvandWing)" />
  <!-- Middle Feather -->
  <path d="M 40 36 C 28 35, 16 37, 10 42 C 20 45, 30 46, 40 46 Z" fill="url(#payvandWing)" opacity="0.9" />
  <!-- Lower Feather (Shortest) -->
  <path d="M 40 49 C 30 49, 20 52, 16 57 C 24 59, 32 59, 40 58 Z" fill="url(#payvandWing)" opacity="0.78" />

  <!-- Main Bold P Pillar (Vertical Axis) -->
  <path d="M 40 84 L 40 18" stroke="url(#payvandGold)" stroke-width="8" stroke-linecap="round" />

  <!-- P Loop embracing the Sacred Ring of Covenant -->
  <path d="M 40 18 C 58 18, 78 26, 78 40 C 78 54, 58 62, 40 62" 
        stroke="url(#payvandGold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sacred Ring of Covenant (حلقه پیمان جاودان اهورا مزدا) -->
  <circle cx="56" cy="40" r="11" stroke="url(#payvandGold)" stroke-width="3" />
  <circle cx="56" cy="40" r="4.5" fill="#FDE047" />

  <!-- Twin Lower Faravahar Ribbons / Streamers (Dâmân) -->
  <path d="M 40 68 C 30 76, 20 80, 12 82" stroke="url(#payvandWing)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 40 68 C 48 76, 56 80, 64 82" stroke="url(#payvandGold)" stroke-width="4.5" stroke-linecap="round" />
</svg>