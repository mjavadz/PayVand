<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Imperial Persian Gold Gradient -->
    <linearGradient id="artGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="35%" stop-color="#FFD54F" />
      <stop offset="70%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <!-- Persian Turquoise / Firouzeh Gradient -->
    <linearGradient id="artFirouzeh" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="45%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>

    <!-- Royal Aura Glow -->
    <filter id="royalGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00E5FF" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFB300" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Dynamic Sovereign Persian Wing (بال سه‌گانه شاهین هخامنشی) -->
  <!-- Layer 1: Outer Flight Wing Arc forming the head of P -->
  <path d="M 28 84 L 28 26 C 28 15, 38 9, 50 9 C 68 9, 86 10, 95 10 C 80 18, 70 26, 70 38 C 70 52, 58 61, 44 61 L 28 61" 
        stroke="url(#artFirouzeh)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#royalGlow)" />

  <!-- Layer 2: Second Inner Wing Feather (پرّ دوم بال اندیشه نیک) -->
  <path d="M 28 38 C 34 32, 44 30, 56 30 C 64 30, 72 34, 76 38 C 70 44, 60 48, 50 48 L 28 48" 
        stroke="url(#artFirouzeh)" stroke-width="4.5" stroke-linecap="round" opacity="0.85" />

  <!-- Layer 3: Sacred Mithraic Ring of Covenant (حلقه پیمان و خُوَرنَه در کانون) -->
  <circle cx="48" cy="38" r="11" stroke="url(#artGold)" stroke-width="4" />
  <circle cx="48" cy="38" r="4.5" fill="#FFF176" />

  <!-- The Faravahar Royal Streamer / Khvarenah Tail (روبان فَرّ کیانی در پایه) -->
  <path d="M 28 68 C 18 76, 12 80, 6 82" stroke="url(#artGold)" stroke-width="5" stroke-linecap="round" />
  <path d="M 28 68 C 36 76, 44 80, 52 82" stroke="url(#artFirouzeh)" stroke-width="5" stroke-linecap="round" />
</svg>